name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for E2E
        # Die Paketquellen des Runners sind zeitweise nicht erreichbar (apt: "Temporary failure resolving").
        # Dreimal versuchen; danach nur den Browser laden, die Systempakete bringt das Runner-Image schon mit.
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Versuch $i fehlgeschlagen, neuer Versuch in 20 s"
            sleep 20
          done
          npx playwright install chromium
      - name: E2E (smoke de/en, axe; je Spiel)
        run: npm run e2e
      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: e2e-screens
          if-no-files-found: ignore
      - name: Balance (Lichtwarte, engaged, 72 h, Zielkorridore)
        run: SUMMARY=1 CHECK=1 npm run -s balance -- lichtwarte engaged 72
      - name: Balance-Smoke (Vorlage, engaged, 2 h)
        run: SUMMARY=1 npm run -s balance -- vorlage engaged 2
